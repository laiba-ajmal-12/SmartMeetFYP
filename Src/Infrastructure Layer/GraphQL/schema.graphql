# =========================
#         TYPES
# =========================

type Users {
  id: Int!
  name: String!
  email: String!
  ImagePath: String
  createdAt: String!
  organization: [Organization!]
  member: [OrganizationMember!]
  ownedOrganizations:[Organization!]
}

type Organization {
  id: Int!
  name: String!
  description: String!
  ImagePath: String
  createAt: String!
  organizationCode: String
  domainName: String
  domainRestrictionFlag: Boolean!
  ownerId: Int
  totalParticipants:Int
  owner: Users
  meeting(time: String  = "0", limit:Int = 0): [Meeting!]
  members: [OrganizationMember!]
}

type OrganizationMember {
  id: Int!
  organizationId: Int!
  userId: Int!
  joinedAt: String!
  user: Users!
  organization: Organization!
}

type Meeting {
  id: Int!
  name: String!
  description: String
  organizationId: Int!
  daily: Boolean!
  weekly: Boolean!
  startTime: String!
  hostId: Int!
  EnableEngagement:Boolean!
  Engagment:Int!
  meetingDuration:Int!
  meetingLink:String!
  organization: Organization!
  host: Users!
}

# =========================
#        QUERIES (GET)
# =========================

type Query {
  getUserbyId: Users
  getOrganizationbyId(id:Int!):Organization
  getMeetingById(id:Int!):Meeting
}
